[package]
name = "gxoled_studio"
version.workspace = true
edition = "2024"
description = "GxOled GIF Studio engine: GIF decoding, geometry, tone and dither pipeline to 1-bit OLED frames, GIF export, project files"
license = "GPL-3.0-only"

[dependencies]
gxoled_lib = { path = "../gxoled_lib" }

anyhow = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
