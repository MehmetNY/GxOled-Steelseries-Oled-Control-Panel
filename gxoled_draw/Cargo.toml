[package]
name = "gxoled_draw"
version.workspace = true
edition = "2024"

[dependencies]
gxoled_lib = { path = "../gxoled_lib" }

anyhow = "1.0"
chrono = "0.4"
# The formats `gxoled-cli img` can open. `default-features = false` leaves out the AVIF encoder (rav1e / ravif,
# and through them a yanked crate, `core2`) that nothing here uses; the GUI decodes only GIF and PNG.
image = { version = "0.25", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
parking_lot = "0.12"
rusttype = "0.9"
spin_sleep = "1.3"
